name: Indian Energy Exchange
description: 'Indian Energy Exchange (IEX) is India''s largest electricity trading
  platform, operating a nationwide automated exchange for the physical delivery of
  electricity, renewable energy, and certificates. IEX runs Day-Ahead, Real-Time,
  Term-Ahead, Renewable Energy Certificate and Energy Saving Certificate market segments,
  matching buy and sell bids across a member network of distribution utilities, industrial
  and commercial consumers, and power generators. For members with sophisticated trading
  needs IEX offers a members-only trading API (currently for the iDAM and RTM segments)
  supporting order placement, trade-data retrieval and real-time monitoring for automated
  and high-frequency trading; access is provisioned to registered members rather than
  published as a public developer portal. Surfaced as a portfolio company and added
  to the API Evangelist network for enrichment.'
